[project]
name = "todo-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.0",
    "gradio>=6.30.0",
    "langchain-openai>=1.7.0",
    "langchain[mcp]>=1.4.0",
    "mcp[cli]>=2.3.0",
    "openai>=3.29.0",
    "requests>=2.34.2",
]

[project.scripts]
todo-agent = "todo_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
